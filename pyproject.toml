[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsora-ai"
version = "0.1.0"
description = "Falsora AI & Forensic Engine — modules 6.6, 6.7, 6.16 and Model Optimization"
readme = "README_AI.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Maheen Fatima", email = "maheenfatima4466@gmail.com" }]

# Core dependencies only — importing falsora_ai.contracts must stay cheap so
# that Ujala's API layer and Mehreen's decision engine can depend on this
# package without installing torch.
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Everything needed to train and run models.
ml = [
    # Upper bound on torch is not cosmetic: torch 2.6 flipped the default of
    # `torch.load` to weights_only=True, which breaks facenet-pytorch's
    # pretrained MTCNN weight loading.
    "torch>=2.2,<2.6",
    "torchvision>=0.17,<0.21",
    "timm>=1.0",
    # numpy MUST stay below 2. torch wheels in the 2.2-2.5 range are compiled
    # against the numpy 1.x C API; under numpy 2.x torch imports with
    # "Failed to initialize NumPy: _ARRAY_API not found" and then dies at the
    # first array conversion with "Could not infer dtype of numpy.uint8" —
    # deep inside MTCNN, i.e. after a multi-hour extraction has begun.
    # Raising this ceiling requires raising the torch floor to >=2.6 first,
    # which in turn requires replacing facenet-pytorch. Do not loosen casually.
    "numpy>=1.26,<2",
    # OpenCV 5.x is a new major line that requires numpy>=2, so it collides
    # with the constraint above. 4.x is also the version this pipeline was
    # verified against.
    "opencv-python-headless>=4.9,<5",
    "pillow>=10.0",
    "albumentations>=1.4",
    "facenet-pytorch>=2.5",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "grad-cam>=1.5",
]
# Model optimization module.
optimize = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["falsora_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: requires a CUDA device",
    "data: requires raw_datasets/ to be present",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
